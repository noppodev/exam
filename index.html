<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NoppoExam</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Noto+Sans+JP:wght@400;700;900&family=Noto+Serif+JP:wght@500;700;900&display=swap');
        
        :root {
            --noppo-black: #000000;
            --noppo-white: #ffffff;
            --noppo-zinc: #f4f4f5;
        }

        body { 
            font-family: 'Inter', 'Noto Sans JP', sans-serif; 
            background-color: var(--noppo-white);
            color: var(--noppo-black);
            -webkit-tap-highlight-color: transparent;
        }

        .pdf-page {
            width: 210mm;
            min-height: 297mm;
            padding: 20mm;
            margin: 0 auto 20px auto;
            background: white;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            color: #000;
        }

        @media (max-width: 768px) {
            .pdf-preview-container {
                transform: scale(0.4);
                transform-origin: top center;
                width: 210mm;
                margin-bottom: -180mm;
            }
        }

        .font-serif-jp { font-family: 'Noto Serif JP', serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        input, textarea, select {
            border-radius: 0 !important;
            appearance: none;
        }

        .tab-active {
            color: black !important;
            border-bottom: 2px solid black;
        }

        /* Loading Animation */
        .loading-overlay {
            position: fixed; inset: 0; background: white; z-index: 100;
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 1.5rem; letter-spacing: -0.05em;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body class="overflow-hidden bg-white">

    <div id="loading" class="loading-overlay">NoppoExam.</div>

    <div id="app" class="h-screen flex flex-col opacity-0 transition-opacity duration-500">
        <!-- Header -->
        <header class="h-14 border-b border-zinc-100 flex items-center justify-between px-6 shrink-0 bg-white z-20">
            <div class="font-black italic text-lg tracking-tighter">NoppoExam.</div>
            <div id="status" class="text-[9px] font-black text-zinc-300 uppercase tracking-widest">Saved</div>
        </header>

        <!-- Main Content -->
        <main id="main-content" class="flex-1 overflow-y-auto no-scrollbar pb-24">
            <!-- Content will be injected here -->
        </main>

        <!-- Bottom Navigation -->
        <nav class="h-16 border-t border-zinc-100 bg-white flex items-center justify-around px-2 shrink-0 z-20">
            <button onclick="changeView('edit')" id="nav-edit" class="flex flex-col items-center gap-1 text-black">
                <i data-lucide="edit-3" class="w-5 h-5"></i>
                <span class="text-[9px] font-black uppercase tracking-tighter">作成</span>
            </button>
            <button onclick="changeView('preview')" id="nav-preview" class="flex flex-col items-center gap-1 text-zinc-300">
                <i data-lucide="eye" class="w-5 h-5"></i>
                <span class="text-[9px] font-black uppercase tracking-tighter">確認</span>
            </button>
            <button onclick="changeView('settings')" id="nav-settings" class="flex flex-col items-center gap-1 text-zinc-300">
                <i data-lucide="sliders" class="w-5 h-5"></i>
                <span class="text-[9px] font-black uppercase tracking-tighter">設定</span>
            </button>
        </nav>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const fbApp = initializeApp(firebaseConfig);
        const auth = getAuth(fbApp);
        const db = getFirestore(fbApp);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'noppo-exam-v1';

        let state = {
            view: 'edit',
            test: {
                title: '第1回 定期考査',
                subject: '数学 I',
                instructions: '1. 答えはすべて解答用紙に記入すること。\n2. 計算は問題用紙の余白で行うこと。',
                sections: [
                    {
                        id: 's1',
                        title: '次の問いに答えなさい。',
                        questions: [
                            { id: 'q1', text: 'x + 5 = 10 のとき、xの値を求めよ。', point: 5, type: 'short' }
                        ]
                    }
                ]
            },
            settings: {
                showCover: true,
                showAnswerSheet: true,
                font: 'font-serif-jp'
            },
            user: null
        };

        // UI Updates
        window.changeView = (view) => {
            state.view = view;
            updateNav();
            render();
        };

        function updateNav() {
            ['edit', 'preview', 'settings'].forEach(v => {
                const btn = document.getElementById(`nav-${v}`);
                if (v === state.view) {
                    btn.classList.remove('text-zinc-300');
                    btn.classList.add('text-black');
                } else {
                    btn.classList.remove('text-black');
                    btn.classList.add('text-zinc-300');
                }
            });
        }

        // Data Management
        function updateTest(path, value) {
            const keys = path.split('.');
            let current = state.test;
            for(let i=0; i<keys.length-1; i++) current = current[keys[i]];
            current[keys[keys.length-1]] = value;
            saveData();
        }

        function addSection() {
            state.test.sections.push({
                id: 's' + Date.now(),
                title: '新しい大問',
                questions: []
            });
            render();
            saveData();
        }

        function addQuestion(sIdx) {
            state.test.sections[sIdx].questions.push({
                id: 'q' + Date.now(),
                text: '',
                point: 5,
                type: 'short'
            });
            render();
            saveData();
        }

        async function saveData() {
            if (!state.user) return;
            document.getElementById('status').innerText = 'Syncing...';
            try {
                await setDoc(doc(db, 'artifacts', appId, 'users', state.user.uid, 'exams', 'current'), {
                    test: state.test,
                    settings: state.settings,
                    updatedAt: Date.now()
                });
                document.getElementById('status').innerText = 'Saved';
            } catch (e) {
                document.getElementById('status').innerText = 'Error';
            }
        }

        // Templates
        function render() {
            const container = document.getElementById('main-content');
            if (state.view === 'edit') {
                container.innerHTML = `
                    <div class="p-6 max-w-2xl mx-auto space-y-8 animate-in fade-in duration-300">
                        <div class="space-y-2">
                            <input type="text" value="${state.test.title}" oninput="updateTest('title', this.value)" class="w-full text-3xl font-black tracking-tighter outline-none border-none bg-transparent" placeholder="試験名">
                            <input type="text" value="${state.test.subject}" oninput="updateTest('subject', this.value)" class="w-full text-sm font-bold text-zinc-400 outline-none border-none bg-transparent" placeholder="科目">
                        </div>

                        <div class="space-y-12">
                            ${state.test.sections.map((s, sIdx) => `
                                <div class="relative pl-6 border-l-2 border-black space-y-6">
                                    <div class="flex items-center gap-3">
                                        <span class="font-black italic text-xl">${sIdx + 1}.</span>
                                        <input type="text" value="${s.title}" oninput="state.test.sections[${sIdx}].title = this.value; saveData();" class="flex-1 font-bold text-lg outline-none" placeholder="指示文">
                                    </div>
                                    
                                    <div class="space-y-4">
                                        ${s.questions.map((q, qIdx) => `
                                            <div class="bg-zinc-50 p-4 space-y-3">
                                                <div class="flex items-center justify-between text-[10px] font-black text-zinc-400 tracking-widest uppercase">
                                                    <span>Question ${qIdx + 1}</span>
                                                    <div class="flex items-center gap-2">
                                                        <input type="number" value="${q.point}" oninput="state.test.sections[${sIdx}].questions[${qIdx}].point = this.value; saveData();" class="w-8 bg-transparent text-center outline-none border-b border-zinc-200">
                                                        <span>Pts</span>
                                                    </div>
                                                </div>
                                                <textarea oninput="state.test.sections[${sIdx}].questions[${qIdx}].text = this.value; saveData();" class="w-full bg-transparent font-bold text-sm outline-none resize-none min-h-[60px]" placeholder="問題文を入力">${q.text}</textarea>
                                            </div>
                                        `).join('')}
                                        <button onclick="addQuestion(${sIdx})" class="w-full py-3 border border-dashed border-zinc-200 text-[10px] font-black text-zinc-300 hover:text-black hover:border-black transition-all">+ ADD QUESTION</button>
                                    </div>
                                </div>
                            `).join('')}
                            
                            <button onclick="addSection()" class="w-full py-10 border-2 border-dashed border-zinc-100 text-[10px] font-black text-zinc-300 tracking-[0.3em] hover:text-black hover:border-black transition-all">
                                + ADD BIG SECTION
                            </button>
                        </div>
                    </div>
                `;
            } else if (state.view === 'preview') {
                container.innerHTML = `
                    <div class="p-4 bg-zinc-100 min-h-full flex flex-col items-center gap-6">
                        <button onclick="exportPDF()" class="w-full max-w-2xl py-4 bg-black text-white text-[10px] font-black tracking-[0.3em] flex items-center justify-center gap-2">
                            <i data-lucide="download" class="w-4 h-4"></i> EXPORT PDF
                        </button>
                        <div id="pdf-content" class="pdf-preview-container">
                            ${renderPDFPages()}
                        </div>
                    </div>
                `;
                lucide.createIcons();
            } else if (state.view === 'settings') {
                container.innerHTML = `
                    <div class="p-8 max-w-md mx-auto space-y-10">
                        <section>
                            <h3 class="text-[10px] font-black text-zinc-300 uppercase tracking-widest mb-6">General Instructions</h3>
                            <textarea oninput="updateTest('instructions', this.value)" class="w-full bg-zinc-50 p-4 text-xs font-bold h-32 outline-none border-none resize-none leading-relaxed">${state.test.instructions}</textarea>
                        </section>
                        <section>
                            <h3 class="text-[10px] font-black text-zinc-300 uppercase tracking-widest mb-6">Visual Style</h3>
                            <div class="space-y-2">
                                <button onclick="state.settings.showCover = !state.settings.showCover; render(); saveData();" class="w-full flex items-center justify-between p-4 bg-zinc-50 ${state.settings.showCover ? 'text-black' : 'text-zinc-300'}">
                                    <span class="text-[10px] font-black uppercase">Cover Page</span>
                                    <i data-lucide="${state.settings.showCover ? 'check' : 'minus'}" class="w-4 h-4"></i>
                                </button>
                                <button onclick="state.settings.showAnswerSheet = !state.settings.showAnswerSheet; render(); saveData();" class="w-full flex items-center justify-between p-4 bg-zinc-50 ${state.settings.showAnswerSheet ? 'text-black' : 'text-zinc-300'}">
                                    <span class="text-[10px] font-black uppercase">Answer Sheet</span>
                                    <i data-lucide="${state.settings.showAnswerSheet ? 'check' : 'minus'}" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </section>
                    </div>
                `;
            }
            lucide.createIcons();
        }

        function renderPDFPages() {
            let html = '';
            const { test, settings } = state;

            // Cover
            if (settings.showCover) {
                html += `
                    <div class="pdf-page flex flex-col items-center justify-between ${settings.font}">
                        <div class="w-full border-y-2 border-black py-4 text-center font-black tracking-[1em] text-sm uppercase">NoppoExam System</div>
                        <div class="flex flex-col items-center gap-8">
                            <h1 class="text-4xl font-black">${test.title}</h1>
                            <div class="text-6xl font-black py-4">${test.subject}</div>
                            <div class="w-64 p-6 border-2 border-black text-[10px] font-bold leading-relaxed whitespace-pre-wrap">${test.instructions}</div>
                        </div>
                        <div class="w-full flex justify-between items-end border-t-2 border-black pt-8">
                            <div class="grid grid-cols-4 w-96 h-12 border-l border-t border-black">
                                ${['組','番号','氏名','得点'].map(l => `<div class="border-r border-b border-black p-1"><span class="text-[6px] font-black">${l}</span></div>`).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }

            // Questions
            html += `
                <div class="pdf-page ${settings.font}">
                    <div class="flex justify-between border-b border-black mb-8 pb-1">
                        <span class="font-black text-[10px] uppercase tracking-widest">Question Paper</span>
                        <span class="font-black text-[10px]">${test.subject}</span>
                    </div>
                    <div class="space-y-12">
                        ${test.sections.map((s, sIdx) => `
                            <div>
                                <div class="flex items-start gap-4 mb-6">
                                    <span class="w-8 h-8 border-2 border-black flex items-center justify-center font-black text-lg shrink-0">${sIdx + 1}</span>
                                    <div class="font-black text-lg pt-0.5">${s.title}</div>
                                </div>
                                <div class="space-y-8 pl-12">
                                    ${s.questions.map((q, qIdx) => `
                                        <div class="flex gap-4">
                                            <span class="font-black text-sm">問 ${qIdx + 1}</span>
                                            <div class="flex-1 font-bold text-sm leading-relaxed">${q.text}</div>
                                            <span class="text-[9px] font-black pt-1 shrink-0">[${q.point}点]</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;

            // Answer Sheet
            if (settings.showAnswerSheet) {
                html += `
                    <div class="pdf-page ${settings.font}">
                        <div class="flex justify-between items-end border-b-2 border-black pb-2 mb-12">
                            <h2 class="text-2xl font-black italic">Answer Sheet.</h2>
                            <div class="grid grid-cols-3 w-64 border-l border-t border-black">
                                ${['組','番号','氏名'].map(l => `<div class="border-r border-b border-black h-10 p-1"><span class="text-[6px] font-black">${l}</span></div>`).join('')}
                            </div>
                        </div>
                        <div class="grid grid-cols-1 gap-8">
                            ${test.sections.map((s, sIdx) => `
                                <div class="border border-black">
                                    <div class="bg-black text-white px-3 py-1 text-[8px] font-black uppercase tracking-widest">${sIdx+1}</div>
                                    <div class="p-6 grid grid-cols-1 gap-6">
                                        ${s.questions.map((q, qIdx) => `
                                            <div class="flex gap-4">
                                                <div class="w-6 h-6 border border-black flex items-center justify-center text-[8px] font-black shrink-0">${qIdx+1}</div>
                                                <div class="flex-1 border-b border-zinc-200 h-8"></div>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            return html;
        }

        window.exportPDF = () => {
            const element = document.getElementById('pdf-content');
            const opt = {
                margin: 0,
                filename: `Exam_${state.test.subject}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
        };

        // Initialize
        async function init() {
            const user = await new Promise(resolve => {
                onAuthStateChanged(auth, async (u) => {
                    if (!u) {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
            type="text" value="${state.testData.subject}" oninput="updateTestData('subject', this.value)" class="w-full text-lg font-bold text-zinc-400 outline-none" placeholder="教科名">
                </div>

                <div class="space-y-6">
                    ${state.testData.sections.map((s, sIdx) => `
                        <div class="border-l-4 border-black pl-5 py-2 mb-10 relative group">
                            <div class="flex items-center gap-3 mb-4">
                                <span class="font-black text-2xl italic">${sIdx + 1}.</span>
                                <input type="text" value="${s.title}" oninput="updateSectionTitle(${sIdx}, this.value)" class="flex-1 font-bold text-lg outline-none" placeholder="指示文">
                                <button onclick="removeSection(${sIdx})" class="text-zinc-200 hover:text-red-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                            </div>
                            
                            <div class="space-y-4">
                                ${s.questions.map((q, qIdx) => `
                                    <div class="bg-zinc-50 p-4 space-y-3">
                                        <div class="flex items-center justify-between">
                                            <span class="text-[10px] font-black text-zinc-400 tracking-widest">問 ${qIdx+1}</span>
                                            <div class="flex items-center gap-2">
                                                <select onchange="updateQuestionType(${sIdx}, ${qIdx}, this.value)" class="text-[9px] font-black bg-white border border-zinc-200 px-1 py-0.5 outline-none">
                                                    <option value="short" ${q.answerType==='short'?'selected':''}>短文</option>
                                                    <option value="long" ${q.answerType==='long'?'selected':''}>記述</option>
                                                </select>
                                                <div class="flex items-center bg-white border border-zinc-200">
                                                    <input type="number" value="${q.point}" oninput="updateQuestionPoint(${sIdx}, ${qIdx}, this.value)" class="w-8 text-[9px] font-black text-center outline-none">
                                                    <span class="text-[8px] font-black pr-1">点</span>
                                                </div>
                                                <button onclick="removeQuestion(${sIdx}, ${qIdx})" class="text-zinc-300"><i data-lucide="x" class="w-3 h-3"></i></button>
                                            </div>
                                        </div>
                                        <textarea oninput="updateQuestionContent(${sIdx}, ${qIdx}, this.value)" class="w-full bg-white p-3 text-sm font-bold border-none outline-none min-h-[60px] resize-none" placeholder="問題文を入力">${q.content}</textarea>
                                    </div>
                                `).join('')}
                                <button onclick="addQuestion(${sIdx})" class="w-full py-3 border border-dashed border-zinc-200 text-[10px] font-black text-zinc-400 hover:text-black hover:border-black transition-all">+ 設問を追加</button>
                            </div>
                        </div>
                    `).join('')}
                    
                    <button onclick="addSection()" class="w-full py-8 border-2 border-dashed border-zinc-100 text-zinc-300 font-black text-xs tracking-[0.2em] hover:text-black hover:border-black transition-all">
                        + 大問を追加
                    </button>
                </div>
            </div>`;
        }

        function renderSettings() {
            return `
            <div class="p-8 pb-24 animate-fade max-w-md mx-auto space-y-10">
                <section>
                    <h3 class="text-[10px] font-black text-zinc-400 uppercase tracking-widest mb-6">試験設定</h3>
                    <div class="space-y-4">
                        <div class="flex flex-col gap-1">
                            <label class="text-[10px] font-black">注意事項</label>
                            <textarea oninput="updateTestData('instructions', this.value)" class="bg-zinc-50 p-4 text-xs font-bold h-32 border-none outline-none resize-none">${state.testData.instructions}</textarea>
                        </div>
                    </div>
                </section>

                <section>
                    <h3 class="text-[10px] font-black text-zinc-400 uppercase tracking-widest mb-6">デザイン</h3>
                    <div class="space-y-3">
                        ${[
                            {id:'showCover', label:'表紙を出力'},
                            {id:'showAnswerSheet', label:'解答用紙を出力'},
                            {id:'showQRCode', label:'本人確認用QRを表示'}
                        ].map(item => `
                            <button onclick="updateDesign('${item.id}', ${!state.design[item.id]})" class="w-full flex items-center justify-between p-4 bg-zinc-50 ${state.design[item.id]?'text-black':'text-zinc-300'}">
                                <span class="text-xs font-black">${item.label}</span>
                                <i data-lucide="${state.design[item.id]?'check-square':'square'}" class="w-4 h-4"></i>
                            </button>
                        `).join('')}
                    </div>
                </section>

                <section class="pt-10 border-t border-zinc-100">
                    <div class="flex items-center gap-4">
                        <img src="${state.user?.photoURL}" class="w-10 h-10 grayscale">
                        <div>
                            <p class="text-xs font-black">${state.user?.displayName}</p>
                            <p class="text-[10px] text-zinc-400 font-bold uppercase tracking-tighter">Noppo User</p>
                        </div>
                    </div>
                </section>
            </div>`;
        }

        function renderPreviewContainer() {
            return `
            <div class="pdf-container animate-fade flex flex-col items-center">
                <div class="w-full max-w-2xl mb-6">
                    <button onclick="downloadPDF()" class="w-full py-4 bg-black text-white text-[10px] font-black tracking-[0.3em] flex items-center justify-center gap-2">
                        <i data-lucide="file-down" class="w-4 h-4"></i> PDFを書き出す (A4)
                    </button>
                </div>
                <div id="pdf-export-area" class="w-full">
                    ${renderActualPDF()}
                </div>
            </div>`;
        }

        function renderActualPDF() {
            const { design, testData } = state;
            const style = `--pdf-padding: ${design.padding}mm; font-size: ${design.fontSize}px;`;
            let html = '';

            // Cover Page
            if (design.showCover) {
                html += `
                <div class="pdf-page flex flex-col items-center ${design.fontFamily}" style="${style}">
                    <div class="flex-1 flex flex-col items-center justify-center w-full space-y-16">
                        <div class="text-[16px] font-black tracking-[1.5em] border-y-2 border-black py-6 w-full text-center uppercase">Examination</div>
                        <h1 class="text-5xl font-black">${testData.title}</h1>
                        <div class="text-7xl font-black pt-6">${testData.subject}</div>
                        <div class="w-full max-w-lg p-8 border-2 border-black space-y-4">
                            <div class="font-black text-sm underline underline-offset-4 italic">注意事項</div>
                            <div class="whitespace-pre-wrap font-bold text-xs leading-relaxed">${testData.instructions}</div>
                        </div>
                    </div>
                    <div class="w-full flex justify-between border-t-2 border-black pt-10 mt-auto">
                        <div class="grid grid-cols-4 w-full max-w-md h-12 border-l border-t border-black">
                             ${['学年','組','番号','氏名'].map(l => `<div class="border-r border-b border-black p-1 flex flex-col justify-between"><span class="text-[7px] font-black">${l}</span></div>`).join('')}
                        </div>
                        ${design.showQRCode ? `<div class="qr-code w-12 h-12 ml-6 border border-black p-0.5"></div>` : ''}
                    </div>
                </div>`;
            }

            // Questions Page
            html += `
            <div class="pdf-page ${design.fontFamily}" style="${style}">
                <div class="flex justify-between border-b border-black mb-6 pb-0.5">
                    <span class="font-bold text-[10px]">試験問題</span>
                    <span class="font-black text-[10px]">${testData.subject}</span>
                </div>
                <div class="space-y-10">
                    ${testData.sections.map((s, sIdx) => `
                        <div style="break-inside: avoid;">
                            <div class="flex items-start gap-3 mb-4">
                                <span class="border border-black w-6 h-6 flex items-center justify-center font-black text-sm shrink-0">${sIdx+1}</span>
                                <div class="font-black text-md pt-0.5">${s.title}</div>
                            </div>
                            <div class="space-y-6 pl-4">
                                ${s.questions.map((q, qIdx) => `
                                    <div class="flex gap-3" style="break-inside: avoid;">
                                        <span class="font-black text-sm">問${qIdx+1}</span>
                                        <div class="flex-1 font-bold text-sm leading-relaxed">${q.content}</div>
                                        <span class="text-[9px] font-black pt-1 shrink-0">（${q.point}点）</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `).join('')}
                </div>
            </div>`;

            // Answer Sheet
            if (design.showAnswerSheet) {
                html += `
                <div class="pdf-page ${design.fontFamily}" style="${style}">
                    <div class="flex justify-between items-end border-b-2 border-black pb-2 mb-8">
                        <h2 class="text-2xl font-black">解答用紙</h2>
                        <div class="grid grid-cols-4 w-[240px] border-l border-t border-black">
                             ${['学年','組','番号','氏名'].map(l => `<div class="border-r border-b border-black h-8 p-1"><span class="text-[6px] font-black">${l}</span></div>`).join('')}
                        </div>
                    </div>
                    <div class="space-y-6">
                        ${testData.sections.map((s, sIdx) => `
                            <div class="border border-black" style="break-inside: avoid;">
                                <div class="bg-black text-white px-2 py-0.5 text-[7px] font-black italic">${sIdx+1}</div>
                                <div class="p-4 space-y-4">
                                    ${s.questions.map((q, qIdx) => `
                                        <div class="flex gap-3">
                                            <div class="text-[8px] font-black w-5 h-5 border border-black flex items-center justify-center shrink-0">${qIdx+1}</div>
                                            <div class="flex-1 border border-zinc-200 min-h-[30px] ${q.answerType==='long'?'min-h-[100px]':''}"></div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>`;
            }

            return html;
        }

        // --- Logic Functions ---
        window.switchTab = (tab) => { state.activeTab = tab; render(); };
        window.updateDesign = (key, val) => { state.design[key] = val; render(); debouncedSave(); };
        window.updateTestData = (key, val) => { state.testData[key] = val; debouncedSave(); };
        window.updateSectionTitle = (sIdx, val) => { state.testData.sections[sIdx].title = val; debouncedSave(); };
        window.addSection = () => { state.testData.sections.push({ id: 's'+Date.now(), title: '問題を入力してください', questions: [] }); render(); debouncedSave(); };
        window.removeSection = (sIdx) => { state.testData.sections.splice(sIdx, 1); render(); debouncedSave(); };
        window.addQuestion = (sIdx) => { state.testData.sections[sIdx].questions.push({ id: 'q'+Date.now(), content: '問題の内容をここに入力', answerType: 'short', point: 5 }); render(); debouncedSave(); };
        window.removeQuestion = (sIdx, qIdx) => { state.testData.sections[sIdx].questions.splice(qIdx, 1); render(); debouncedSave(); };
        window.updateQuestionType = (sIdx, qIdx, val) => { state.testData.sections[sIdx].questions[qIdx].answerType = val; debouncedSave(); };
        window.updateQuestionPoint = (sIdx, qIdx, val) => { state.testData.sections[sIdx].questions[qIdx].point = parseInt(val) || 0; debouncedSave(); };
        window.updateQuestionContent = (sIdx, qIdx, val) => { state.testData.sections[sIdx].questions[qIdx].content = val; debouncedSave(); };

        window.renderStatus = () => {
            const el = document.getElementById('save-indicator');
            if (el) el.innerHTML = state.isSaving ? 'SYNCING...' : 'SAVED';
        };

        window.renderQRCodes = () => {
            document.querySelectorAll('.qr-code').forEach(el => {
                el.innerHTML = '';
                new QRCode(el, { text: state.user?.uid || "NoppoExam", width: 48, height: 48, colorDark: "#000000", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H });
            });
        };

        window.downloadPDF = () => {
            const element = document.getElementById('pdf-export-area');
            const opt = {
                margin: 0,
                filename: `${state.testData.title}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak: { mode: ['css', 'legacy'] }
            };
            html2pdf().set(opt).from(element).save();
        };

        // --- Init ---
        (async () => {
            const user = await loadUser();
            if (user) {
                state.user = user;
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                const snap = await getDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'data', 'current_exam'));
                if (snap.exists()) {
                    const d = snap.data();
                    state.testData = d.testData || state.testData;
                    state.design = d.design || state.design;
                }
            }
            state.loading = false;
            render();
        })();
    </script>
</body>
</html>
