<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NoppoExam</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Noto+Sans+JP:wght@400;700;900&family=Noto+Serif+JP:wght@500;700;900&display=swap');
        
        :root {
            --noppo-black: #000000;
            --noppo-white: #ffffff;
            --noppo-zinc: #f4f4f5;
        }

        body { 
            font-family: 'Inter', 'Noto Sans JP', sans-serif; 
            background-color: var(--noppo-white);
            color: var(--noppo-black);
            -webkit-tap-highlight-color: transparent;
        }

        .pdf-page {
            width: 210mm;
            min-height: 297mm;
            padding: 20mm;
            margin: 0 auto 20px auto;
            background: white;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            color: #000;
            position: relative;
        }

        @media (max-width: 768px) {
            .pdf-preview-container {
                transform: scale(0.4);
                transform-origin: top center;
                width: 210mm;
                margin-bottom: -180mm;
            }
        }

        .font-serif-jp { font-family: 'Noto Serif JP', serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        input, textarea, select {
            border-radius: 0 !important;
            appearance: none;
        }

        /* Loading Animation */
        .loading-overlay {
            position: fixed; inset: 0; background: white; z-index: 100;
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 1.5rem; letter-spacing: -0.05em;
            transition: opacity 0.5s ease;
        }

        .animate-fade { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="overflow-hidden bg-white">

    <div id="loading" class="loading-overlay">NoppoExam.</div>

    <div id="app" class="h-screen flex flex-col opacity-0 transition-opacity duration-500">
        <header class="h-14 border-b border-zinc-100 flex items-center justify-between px-6 shrink-0 bg-white z-20">
            <div class="font-black italic text-lg tracking-tighter">NoppoExam.</div>
            <div id="save-indicator" class="text-[9px] font-black text-zinc-300 uppercase tracking-widest">Ready</div>
        </header>

        <main id="main-content" class="flex-1 overflow-y-auto no-scrollbar pb-24">
            </main>

        <nav class="h-16 border-t border-zinc-100 bg-white flex items-center justify-around px-2 shrink-0 z-20">
            <button onclick="switchTab('edit')" id="nav-edit" class="flex flex-col items-center gap-1">
                <i data-lucide="edit-3" class="w-5 h-5"></i>
                <span class="text-[9px] font-black uppercase tracking-tighter">作成</span>
            </button>
            <button onclick="switchTab('preview')" id="nav-preview" class="flex flex-col items-center gap-1">
                <i data-lucide="eye" class="w-5 h-5"></i>
                <span class="text-[9px] font-black uppercase tracking-tighter">確認</span>
            </button>
            <button onclick="switchTab('settings')" id="nav-settings" class="flex flex-col items-center gap-1">
                <i data-lucide="sliders" class="w-5 h-5"></i>
                <span class="text-[9px] font-black uppercase tracking-tighter">設定</span>
            </button>
        </nav>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        // Firebase Config (もし環境変数がない場合は空オブジェクトを回避)
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'noppo-exam-v1';
        
        let fbApp, auth, db;
        
        if (firebaseConfig.apiKey) {
            fbApp = initializeApp(firebaseConfig);
            auth = getAuth(fbApp);
            db = getFirestore(fbApp);
        }

        window.state = {
            activeTab: 'edit',
            isSaving: false,
            user: null,
            testData: {
                title: '第1回 定期考査',
                subject: '数学 I',
                instructions: '1. 答えはすべて解答用紙に記入すること。\n2. 計算は問題用紙の余白で行うこと。',
                sections: [
                    {
                        id: 's1',
                        title: '次の問いに答えなさい。',
                        questions: [
                            { id: 'q1', content: 'x + 5 = 10 のとき、xの値を求めよ。', point: 5, answerType: 'short' }
                        ]
                    }
                ]
            },
            design: {
                showCover: true,
                showAnswerSheet: true,
                showQRCode: true,
                fontFamily: 'font-serif-jp',
                fontSize: 14,
                padding: 20
            }
        };

        // --- Core Logic ---

        window.render = () => {
            const container = document.getElementById('main-content');
            const appEl = document.getElementById('app');
            
            // ナビゲーションのスタイル更新
            ['edit', 'preview', 'settings'].forEach(tab => {
                const btn = document.getElementById(`nav-${tab}`);
                if (tab === state.activeTab) {
                    btn.className = 'flex flex-col items-center gap-1 text-black';
                } else {
                    btn.className = 'flex flex-col items-center gap-1 text-zinc-300';
                }
            });

            if (state.activeTab === 'edit') {
                container.innerHTML = renderEdit();
            } else if (state.activeTab === 'preview') {
                container.innerHTML = renderPreviewContainer();
                setTimeout(() => renderQRCodes(), 100);
            } else if (state.activeTab === 'settings') {
                container.innerHTML = renderSettings();
            }

            lucide.createIcons();
            appEl.classList.add('opacity-100');
            document.getElementById('loading').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
            }, 500);
        };

        // --- Templates ---

        function renderEdit() {
            return `
            <div class="p-6 max-w-2xl mx-auto space-y-8 animate-fade">
                <div class="space-y-2">
                    <input type="text" value="${state.testData.title}" oninput="updateTestData('title', this.value)" class="w-full text-3xl font-black tracking-tighter outline-none border-none bg-transparent" placeholder="試験名">
                    <input type="text" value="${state.testData.subject}" oninput="updateTestData('subject', this.value)" class="w-full text-sm font-bold text-zinc-400 outline-none border-none bg-transparent" placeholder="科目">
                </div>
                <div class="space-y-12">
                    ${state.testData.sections.map((s, sIdx) => `
                        <div class="relative pl-6 border-l-2 border-black space-y-6">
                            <div class="flex items-center gap-3">
                                <span class="font-black italic text-xl">${sIdx + 1}.</span>
                                <input type="text" value="${s.title}" oninput="updateSectionTitle(${sIdx}, this.value)" class="flex-1 font-bold text-lg outline-none" placeholder="指示文">
                                <button onclick="removeSection(${sIdx})" class="text-zinc-300 hover:text-red-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                            </div>
                            <div class="space-y-4">
                                ${s.questions.map((q, qIdx) => `
                                    <div class="bg-zinc-50 p-4 space-y-3">
                                        <div class="flex items-center justify-between">
                                            <span class="text-[10px] font-black text-zinc-400 uppercase">Question ${qIdx + 1}</span>
                                            <div class="flex items-center gap-2">
                                                <input type="number" value="${q.point}" oninput="updateQuestionPoint(${sIdx}, ${qIdx}, this.value)" class="w-8 bg-transparent text-center text-[10px] font-black border-b border-zinc-200 outline-none">
                                                <span class="text-[10px] font-black text-zinc-400">PTS</span>
                                                <button onclick="removeQuestion(${sIdx}, ${qIdx})" class="text-zinc-300 ml-2"><i data-lucide="x" class="w-3 h-3"></i></button>
                                            </div>
                                        </div>
                                        <textarea oninput="updateQuestionContent(${sIdx}, ${qIdx}, this.value)" class="w-full bg-transparent font-bold text-sm outline-none resize-none min-h-[60px]" placeholder="問題文を入力">${q.content}</textarea>
                                    </div>
                                `).join('')}
                                <button onclick="addQuestion(${sIdx})" class="w-full py-3 border border-dashed border-zinc-200 text-[10px] font-black text-zinc-300 hover:text-black hover:border-black transition-all">+ ADD QUESTION</button>
                            </div>
                        </div>
                    `).join('')}
                    <button onclick="addSection()" class="w-full py-10 border-2 border-dashed border-zinc-100 text-[10px] font-black text-zinc-300 tracking-[0.3em] hover:text-black hover:border-black transition-all">+ ADD BIG SECTION</button>
                </div>
            </div>`;
        }

        function renderSettings() {
            return `
            <div class="p-8 max-w-md mx-auto space-y-10 animate-fade">
                <section>
                    <h3 class="text-[10px] font-black text-zinc-300 uppercase tracking-widest mb-6">General Instructions</h3>
                    <textarea oninput="updateTestData('instructions', this.value)" class="w-full bg-zinc-50 p-4 text-xs font-bold h-32 outline-none border-none resize-none leading-relaxed">${state.testData.instructions}</textarea>
                </section>
                <section>
                    <h3 class="text-[10px] font-black text-zinc-300 uppercase tracking-widest mb-6">Visual Style</h3>
                    <div class="space-y-2">
                        <button onclick="updateDesign('showCover', ${!state.design.showCover})" class="w-full flex items-center justify-between p-4 bg-zinc-50 ${state.design.showCover ? 'text-black' : 'text-zinc-300'}">
                            <span class="text-[10px] font-black uppercase">Cover Page</span>
                            <i data-lucide="${state.design.showCover ? 'check' : 'minus'}" class="w-4 h-4"></i>
                        </button>
                        <button onclick="updateDesign('showAnswerSheet', ${!state.design.showAnswerSheet})" class="w-full flex items-center justify-between p-4 bg-zinc-50 ${state.design.showAnswerSheet ? 'text-black' : 'text-zinc-300'}">
                            <span class="text-[10px] font-black uppercase">Answer Sheet</span>
                            <i data-lucide="${state.design.showAnswerSheet ? 'check' : 'minus'}" class="w-4 h-4"></i>
                        </button>
                    </div>
                </section>
            </div>`;
        }

        function renderPreviewContainer() {
            return `
            <div class="p-4 bg-zinc-100 min-h-full flex flex-col items-center gap-6 animate-fade">
                <button onclick="downloadPDF()" class="w-full max-w-2xl py-4 bg-black text-white text-[10px] font-black tracking-[0.3em] flex items-center justify-center gap-2">
                    <i data-lucide="download" class="w-4 h-4"></i> EXPORT PDF
                </button>
                <div id="pdf-export-area" class="pdf-preview-container">
                    ${renderActualPDF()}
                </div>
            </div>`;
        }

        function renderActualPDF() {
            const { design, testData } = state;
            let html = '';

            if (design.showCover) {
                html += `
                <div class="pdf-page flex flex-col items-center justify-between ${design.fontFamily}">
                    <div class="w-full border-y-2 border-black py-4 text-center font-black tracking-[1em] text-sm uppercase">NoppoExam System</div>
                    <div class="flex flex-col items-center gap-8">
                        <h1 class="text-4xl font-black">${testData.title}</h1>
                        <div class="text-6xl font-black py-4">${testData.subject}</div>
                        <div class="w-64 p-6 border-2 border-black text-[10px] font-bold leading-relaxed whitespace-pre-wrap">${testData.instructions}</div>
                    </div>
                    <div class="w-full flex justify-between items-end border-t-2 border-black pt-8">
                        <div class="grid grid-cols-4 w-96 h-12 border-l border-t border-black">
                             ${['組','番号','氏名','得点'].map(l => `<div class="border-r border-b border-black p-1"><span class="text-[6px] font-black">${l}</span></div>`).join('')}
                        </div>
                        ${design.showQRCode ? `<div class="qr-code w-12 h-12 border border-black p-0.5"></div>` : ''}
                    </div>
                </div>`;
            }

            html += `
            <div class="pdf-page ${design.fontFamily}">
                <div class="flex justify-between border-b border-black mb-8 pb-1">
                    <span class="font-black text-[10px] uppercase tracking-widest">Question Paper</span>
                    <span class="font-black text-[10px]">${testData.subject}</span>
                </div>
                <div class="space-y-12">
                    ${testData.sections.map((s, sIdx) => `
                        <div>
                            <div class="flex items-start gap-4 mb-6">
                                <span class="w-8 h-8 border-2 border-black flex items-center justify-center font-black text-lg shrink-0">${sIdx + 1}</span>
                                <div class="font-black text-lg pt-0.5">${s.title}</div>
                            </div>
                            <div class="space-y-8 pl-12">
                                ${s.questions.map((q, qIdx) => `
                                    <div class="flex gap-4">
                                        <span class="font-black text-sm">問 ${qIdx + 1}</span>
                                        <div class="flex-1 font-bold text-sm leading-relaxed">${q.content}</div>
                                        <span class="text-[9px] font-black pt-1 shrink-0">[${q.point}点]</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `).join('')}
                </div>
            </div>`;

            if (design.showAnswerSheet) {
                html += `
                <div class="pdf-page ${design.fontFamily}">
                    <div class="flex justify-between items-end border-b-2 border-black pb-2 mb-12">
                        <h2 class="text-2xl font-black italic">Answer Sheet.</h2>
                        <div class="grid grid-cols-3 w-64 border-l border-t border-black">
                             ${['組','番号','氏名'].map(l => `<div class="border-r border-b border-black h-10 p-1"><span class="text-[6px] font-black">${l}</span></div>`).join('')}
                        </div>
                    </div>
                    <div class="grid grid-cols-1 gap-8">
                        ${testData.sections.map((s, sIdx) => `
                            <div class="border border-black">
                                <div class="bg-black text-white px-3 py-1 text-[8px] font-black uppercase tracking-widest">${sIdx+1}</div>
                                <div class="p-6 grid grid-cols-1 gap-6">
                                    ${s.questions.map((q, qIdx) => `
                                        <div class="flex gap-4">
                                            <div class="w-6 h-6 border border-black flex items-center justify-center text-[8px] font-black shrink-0">${qIdx+1}</div>
                                            <div class="flex-1 border-b border-zinc-200 h-8"></div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>`;
            }

            return html;
        }

        // --- Logic Functions ---

        window.switchTab = (tab) => { state.activeTab = tab; render(); };
        window.updateTestData = (key, val) => { state.testData[key] = val; debouncedSave(); };
        window.updateDesign = (key, val) => { state.design[key] = val; render(); debouncedSave(); };
        window.updateSectionTitle = (sIdx, val) => { state.testData.sections[sIdx].title = val; debouncedSave(); };
        window.addSection = () => { state.testData.sections.push({ id: 's'+Date.now(), title: '新しい指示文', questions: [] }); render(); debouncedSave(); };
        window.removeSection = (sIdx) => { state.testData.sections.splice(sIdx, 1); render(); debouncedSave(); };
        window.addQuestion = (sIdx) => { state.testData.sections[sIdx].questions.push({ id: 'q'+Date.now(), content: '', point: 5, answerType: 'short' }); render(); debouncedSave(); };
        window.removeQuestion = (sIdx, qIdx) => { state.testData.sections[sIdx].questions.splice(qIdx, 1); render(); debouncedSave(); };
        window.updateQuestionPoint = (sIdx, qIdx, val) => { state.testData.sections[sIdx].questions[qIdx].point = parseInt(val) || 0; debouncedSave(); };
        window.updateQuestionContent = (sIdx, qIdx, val) => { state.testData.sections[sIdx].questions[qIdx].content = val; debouncedSave(); };

        let saveTimeout;
        function debouncedSave() {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(saveData, 1000);
        }

        async function saveData() {
            if (!state.user || !db) return;
            const indicator = document.getElementById('save-indicator');
            indicator.innerText = 'Syncing...';
            try {
                await setDoc(doc(db, 'artifacts', appId, 'users', state.user.uid, 'exams', 'current'), {
                    testData: state.testData,
                    design: state.design,
                    updatedAt: Date.now()
                });
                indicator.innerText = 'Saved';
            } catch (e) {
                console.error(e);
                indicator.innerText = 'Error';
            }
        }

        window.renderQRCodes = () => {
            document.querySelectorAll('.qr-code').forEach(el => {
                el.innerHTML = '';
                new QRCode(el, { text: state.user?.uid || "NoppoExam", width: 48, height: 48, colorDark: "#000000", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H });
            });
        };

        window.downloadPDF = () => {
            const element = document.getElementById('pdf-export-area');
            const opt = {
                margin: 0,
                filename: `Exam_${state.testData.subject}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
        };

        // --- Initialization ---

        async function init() {
            if (auth) {
                onAuthStateChanged(auth, async (user) => {
                    if (!user) {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } else {
                        state.user = user;
                        const snap = await getDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'exams', 'current'));
                        if (snap.exists()) {
                            const d = snap.data();
                            state.testData = d.testData || state.testData;
                            state.design = d.design || state.design;
                        }
                        render();
                    }
                });
            } else {
                // Firebase設定がない場合でもアプリを起動できるようにする
                render();
            }
        }

        init();
    </script>
</body>
</html>
